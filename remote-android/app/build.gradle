plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'app.frameplayer.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'app.frameplayer.remote'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.6.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}